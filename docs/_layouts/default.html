<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/userStyle.css' | relative_url }}">
    <script src="{{ '/assets/js/navBar.js' | relative.url }}"></script>
    {% include head-custom.html %}

{% seo %}
  </head>

  <body>

    <header>
      <div class="container">
        <a id="a-title">
          <h1>{{ site.title }}</h1>
        </a>
        <h2>{{ site.description | default: site.github.project_tagline }}</h2>
      </div>
    </header>

    <div id="navSidebar" class="sidenav">
      <a href="javascript:void(0) class="closebtn" onclick="closeNav()">&times;</a>
      <div>
        <h2>{{ site.data.navlist.docs_list_title }}</h2>
        <ul>
          {% for item in site.data.navlist.docs %}
            <li><a href="{{ item.url }}">{{ item.title }}</a></li>
          {% endfor %}
        </ul>
      </div>
    </div>

    <button>
      <span onclick="openNav()">open</span>
    </button>

    <div class="container">
      <section id="main_content">
        {{ content }}
      </section>
    </div>
  </body>
</html>
